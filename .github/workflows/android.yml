name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'app/**', 'soundfonts/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'app/**', 'soundfonts/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Check shared music engine and Android adapter
        run: |
          for suite in app/test-*.cjs; do
            case "$suite" in *test-android-browser.cjs) continue;; esac
            node "$suite"
          done
      - name: Assemble APK and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Verify generated assets
        run: node android/tools/prepare-assets.cjs --check
      - uses: actions/upload-artifact@v4
        with:
          name: Chordloom-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
